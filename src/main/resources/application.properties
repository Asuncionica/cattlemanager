spring.application.name=cattlemanager

# ── DATABASE ──────────────────────────────────────────────────────────────────
# Sobreescribir en producción con variables de entorno: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cattlemanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# dev: update | producción: validate (env var DDL_AUTO=validate)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

server.port=${SERVER_PORT:8085}

# ── JWT ───────────────────────────────────────────────────────────────────────
# OBLIGATORIO en producción: JWT_SECRET debe ser una clave Base64 de mínimo 256 bits
# Generar con: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:Y2F0dGxlbWFuYWdlcnNlY3JldGtleTEyMzQ1Njc4OTAxMjM0NQ==}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
